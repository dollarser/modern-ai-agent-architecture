name: Link Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'examples/**/*.py'
      - 'scripts/check_code_sources.py'
      - 'scripts/check_external_links.py'
      - '.github/workflows/link-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'examples/**/*.py'
      - 'scripts/check_code_sources.py'
      - 'scripts/check_external_links.py'
      - '.github/workflows/link-check.yml'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check internal links
        run: python scripts/check_internal_links.py .

      - name: Check documented code sources
        run: python scripts/check_code_sources.py .

      - name: Check links
        run: |
          python scripts/check_external_links.py .

      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-results
          path: link-check-results.txt
