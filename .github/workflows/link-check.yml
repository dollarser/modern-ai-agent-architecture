name: Link Check

on:
  push:
    paths:
      - '**/*.md'
      - 'examples/**/*.py'
      - 'scripts/check_code_sources.py'
  pull_request:
    paths:
      - '**/*.md'
      - 'examples/**/*.py'
      - 'scripts/check_code_sources.py'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.15.0

      - name: Check internal links
        run: python scripts/check_internal_links.py .

      - name: Check documented code sources
        run: python scripts/check_code_sources.py .

      - name: Check links
        run: |
          python scripts/check_external_links.py .

      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-results
          path: link-check-results.txt
